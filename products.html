<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Shop All Products | Creations of AA</title>

<link rel="stylesheet" href="style.css" />

<style>
/* ===== LAYOUT FIX ===== */
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at center,
    #d4af37 0%,
    #a97458 50%,
    #c0c0c0 100%);
}

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: rgba(255,255,255,0.9);
  position: sticky;
  top: 0;
  z-index: 10;
}

.back-home {
  text-decoration: none;
  font-weight: 600;
  color: #e57f2c;
}

.cart-btn {
  background: #ff9f50;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

/* LAYOUT */
.layout {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  padding: 20px;
  background: rgba(255,255,255,0.8);
}

/* MAIN */
.content {
  flex: 1;
  padding: 20px;
}

/* GRID */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

/* CARD */
.product-card {
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  transition: 0.2s ease;
}

.product-card:hover {
  transform: translateY(-5px);
}

/* FIX ALL IMAGE ISSUES */
.product-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
}

/* BUTTON */
.add-btn {
  background: #ff9f50;
  border: none;
  color: white;
  padding: 8px;
  border-radius: 15px;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
}

.add-btn:hover {
  background: #e57f2c;
}

/* CART COUNTER */
.cart-count {
  background: white;
  color: #e57f2c;
  padding: 2px 8px;
  border-radius: 20px;
  margin-left: 6px;
  font-weight: bold;
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  <a href="index.html" class="back-home">← Back to Home</a>

  <button class="cart-btn" onclick="goToCart()">
    🛒 Cart <span id="cartCount" class="cart-count">0</span>
  </button>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>Shop</h2>
    <ul>
      <li><a href="products.html">All Products</a></li>
      <li><a href="earrings.html">Earrings</a></li>
      <li><a href="necklaces.html">Necklaces</a></li>
      <li><a href="bracelets.html">Bracelets</a></li>
    </ul>
  </aside>

  <!-- MAIN -->
  <main class="content">
    <h1>All Products</h1>

    <section class="product-grid" id="grid"></section>
  </main>

</div>

<script>
/* ================= CART ================= */
let cart = JSON.parse(localStorage.getItem("cart")) || {};

/* ================= PRODUCTS ================= */
const products = [
  {id:"shooting-star",name:"Shooting Star",price:15,image: "products/shooting-star.png"},
  {id:"the-ants",name:"The Ants",price:10,image:"products/the-ants.png"},
  {id:"aligned",name:"Aligned",price:10,image:"products/aligned.png"},
  {id:"constellations",name:"Constellations",price:15,image:"products/constellations.png"},
  {id:"cerulean",name:"Cerulean",price:10,image:"products/cerulean.png"},
  {id:"AA-collectable",name:"AA Collectable",price:15,image:"products/AA-collectable.png"},
  {id:"custom-ms",name:"Custo M's",price:15,image:"products/Custo M's.png"},
  {id:"the-mice",name:"The Mice",price:10,image:"products/the-mice.png"}
];

/* ================= RENDER PRODUCTS ================= */
function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  products.forEach(p => {
    grid.innerHTML += `
      <div class="product-card">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>$${p.price}</p>
        <button class="add-btn" onclick="add('${p.id}')">
          Add to Cart
        </button>
      </div>
    `;
  });

  updateCartCount();
}

/* ================= ADD TO CART ================= */
function add(id) {
  const p = products.find(x => x.id === id);

  if (!cart[id]) cart[id] = {product:p, qty:1};
  else cart[id].qty++;

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

/* ================= CART COUNT ================= */
function updateCartCount() {
  let count = Object.values(cart).reduce((a,b)=>a+b.qty,0);
  document.getElementById("cartCount").innerText = count;
}

/* ================= GO TO CART ================= */
function goToCart() {
  window.location.href = "cart.html";
}

render();
</script>

</body>
</html>
