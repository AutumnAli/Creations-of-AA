<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Shop All Products | Creations of AA</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at center,
    #d4af37 0%,
    #a97458 50%,
    #c0c0c0 100%);
}

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: rgba(255,255,255,0.9);
  position: sticky;
  top: 0;
  z-index: 10;
}

.back-home {
  text-decoration: none;
  font-weight: 600;
  color: #e57f2c;
}

.cart-btn {
  background: #ff9f50;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

/* LAYOUT */
.layout {
  display: flex;
}

/* SIDEBAR FILTERS */
.sidebar {
  width: 220px;
  padding: 20px;
  background: rgba(255,255,255,0.85);
}

.sidebar button {
  display: block;
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: white;
  font-weight: 600;
}

.sidebar button:hover {
  background: #ff9f50;
  color: white;
}

/* MAIN */
.content {
  flex: 1;
  padding: 20px;
}

/* GRID */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

/* CARD */
.product-card {
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  transition: 0.2s ease;
}

.product-card:hover {
  transform: translateY(-5px);
}

/* FIXED IMAGE SYSTEM (THIS SOLVES YOUR SIZE ISSUE) */
.product-card img {
  width: 100%;
  height: 180px;
  object-fit: contain; /* IMPORTANT CHANGE */
  background: #fff;
  border-radius: 10px;
}

/* BUTTON */
.add-btn {
  background: #ff9f50;
  border: none;
  color: white;
  padding: 8px;
  border-radius: 15px;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
}

.add-btn:hover {
  background: #e57f2c;
}

.cart-count {
  background: white;
  color: #e57f2c;
  padding: 2px 8px;
  border-radius: 20px;
  margin-left: 6px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="top-bar">
  <a href="index.html" class="back-home">← Back to Home</a>

  <button class="cart-btn" onclick="goToCart()">
    🛒 Cart <span id="cartCount" class="cart-count">0</span>
  </button>
</div>

<div class="layout">

  <!-- FILTERS -->
  <aside class="sidebar">
    <h2>Shop</h2>

    <button onclick="filter('all')">All Products</button>
    <button onclick="filter('earring')">Earrings</button>
    <button onclick="filter('necklace')">Necklaces</button>
    <button onclick="filter('bracelet')">Bracelets</button>
  </aside>

  <!-- PRODUCTS -->
  <main class="content">
    <h1 id="title">All Products</h1>
    <section class="product-grid" id="grid"></section>
  </main>

</div>

<script>

/* CART */
let cart = JSON.parse(localStorage.getItem("cart")) || {};

/* PRODUCTS (NOW FIXED WITH CATEGORIES) */
const products = [
  {id:"shooting-star",name:"Shooting Star",price:15,image:"products/shooting-star.png",cat:"earring"},
  {id:"the-ants",name:"The Ants",price:10,image:"products/the-ants.png",cat:"earring"},
  {id:"aligned",name:"Aligned",price:10,image:"products/aligned.png",cat:"earring"},
  {id:"constellations",name:"Constellations",price:15,image:"products/constellations.png",cat:"necklace"},
  {id:"cerulean",name:"Cerulean",price:10,image:"products/cerulean.png",cat:"earring"},
  {id:"AA-collectable",name:"AA Collectable",price:15,image:"products/AA-collectable.png",cat:"earring"},
  {id:"custom-ms",name:"Custo M's",price:15,image:"products/custom-ms.png",cat:"earring"},
  {id:"the-mice",name:"The Mice",price:10,image:"products/the-mice.png",cat:"earring"},
  {id:"keiper",name:"Keiper",price:5,image:"products/keiper.png",cat:"bracelet"},
  {id:"solar",name:"Solar",price:5,image:"products/solar.png",cat:"bracelet"},
  {id:"saturn",name:"Saturn",price:5,image:"products/saturn.png",cat:"bracelet"}
];

let currentFilter = "all";

/* FILTER SYSTEM */
function filter(type) {
  currentFilter = type;
  document.getElementById("title").innerText =
    type === "all" ? "All Products" : type.charAt(0).toUpperCase() + type.slice(1);

  render();
}

/* RENDER */
function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const filtered = products.filter(p =>
    currentFilter === "all" ? true : p.cat === currentFilter
  );

  filtered.forEach(p => {
    grid.innerHTML += `
      <div class="product-card">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>$${p.price}</p>
        <button class="add-btn" onclick="add('${p.id}')">
          Add to Cart
        </button>
      </div>
    `;
  });

  updateCartCount();
}

/* CART */
function add(id) {
  const p = products.find(x => x.id === id);

  if (!cart[id]) cart[id] = {product:p, qty:1};
  else cart[id].qty++;

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

/* COUNT */
function updateCartCount() {
  let count = Object.values(cart).reduce((a,b)=>a+b.qty,0);
  document.getElementById("cartCount").innerText = count;
}

function goToCart() {
  window.location.href = "cart.html";
}

render();
</script>

</body>
</html>
