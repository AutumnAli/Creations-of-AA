<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Shop All Products | Creations of AA</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at center,
    #d4af37 0%,
    #a97458 50%,
    #c0c0c0 100%);
}

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
}

.back-home {
  text-decoration: none;
  font-weight: 700;
  color: #e57f2c;
}

/* CART */
.cart-btn {
  background: #ff9f50;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

/* LAYOUT */
.layout {
  display: flex;
}

/* SIDEBAR (FIXED THE WHITE ISSUE) */
.sidebar {
  width: 220px;
  padding: 20px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
  border-right: 1px solid rgba(255,255,255,0.2);
}

.sidebar h2 {
  color: #2b2b2b;
}

.sidebar a {
  display: block;
  padding: 8px;
  margin: 5px 0;
  border-radius: 10px;
  text-decoration: none;
  color: #2b2b2b;
  transition: 0.2s;
}

/* FILTER STYLE (ALL SAME LOOK) */
.sidebar a:hover {
  background: rgba(255,159,80,0.25);
}

.sidebar a.active {
  background: #ff9f50;
  color: white;
}

/* MAIN */
.content {
  flex: 1;
  padding: 20px;
}

/* GRID */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

/* CARD */
.product-card {
  background: rgba(255,255,255,0.92);
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  transition: 0.2s ease;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.product-card:hover {
  transform: translateY(-5px);
}

.product-description {
  flex: 1 1 auto;
  overflow-y: scroll;
  max-height: 110px;
  min-height: 110px;
  margin: 10px 0;
  font-size: 0.95rem;
  line-height: 1.4;
  color: #2b2b2b;
  padding: 10px;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 10px;
  background: rgba(255,255,255,0.98);
  scrollbar-width: thin;
  scrollbar-color: rgba(0,0,0,0.15) transparent;
}

.product-description::-webkit-scrollbar {
  width: 8px;
}

.product-description::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.18);
  border-radius: 999px;
}

/* FIX ALL IMAGE SIZES (Custo M + Mice INCLUDED) */
.product-card img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  border-radius: 10px;
}

/* BUTTON */
.add-btn {
  background: #ff9f50;
  border: none;
  color: white;
  padding: 8px;
  border-radius: 15px;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
}

.add-btn:hover {
  background: #e57f2c;
}

/* CART COUNT */
.cart-count {
  background: white;
  color: #e57f2c;
  padding: 2px 8px;
  border-radius: 20px;
  margin-left: 6px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="top-bar">
  <a href="index.html" class="back-home">← Back to Home</a>

  <button class="cart-btn" onclick="goToCart()">
    🛒 Cart <span id="cartCount" class="cart-count">0</span>
  </button>
</div>

<div class="layout">

  <!-- FILTERS -->
  <aside class="sidebar">
    <h2>Shop</h2>

    <a href="#" class="active" onclick="filter('all')">All Products</a>
    <a href="#" onclick="filter('earrings')">Earrings</a>
    <a href="#" onclick="filter('necklaces')">Necklaces</a>
    <a href="#" onclick="filter('bracelets')">Bracelets</a>
  </aside>

  <!-- MAIN -->
  <main class="content">
    <h1>Shop</h1>
    <section class="product-grid" id="grid"></section>
  </main>

</div>

  {id:"custom-ms", name:"Custo M's", description:"Introducing the ultimate customizable earrings that are as unique as you are! These playful, beaded beauties let you express your personal style with every twist and turn. Crafted with charming white beads arranged in a fun, zigzag pattern, these earrings are perfect for anyone who loves to make a statement with their accessories. The best part? You can customize them to your heart’s content! Whether you want to add a pop of color, mix in some metallic accents, or even incorporate your favorite charms, these earrings are the perfect canvas for your creativity. They’re lightweight and comfortable, making them ideal for everyday wear or special occasions when you want to stand out. Embrace your individuality and let your style shine with these one-of-a-kind customizable earrings that are sure to turn heads and spark conversations wherever you go!", price:18, image:"products/Custo M's.png", category:"earrings"},

  {id:"the-mice", name:"The Mice", description:"Step up your accessory game with these charming and unique earrings that blend natural warmth with a touch of metallic shine! Featuring a bold, earthy orange bead perfectly framed by sleek metallic spheres, these earrings bring a delightful balance of rustic and modern vibes to any outfit. Whether you're dressing up for a night out or adding a pop of personality to your everyday look, these earrings are your new go-to for effortless style. Lightweight and comfortable, they’re designed to make you feel as good as you look. Embrace the playful yet sophisticated spirit of these earrings and let them become your signature statement piece!", price:8, image:"products/the-mice.png", category:"earrings"},

  {id:"solar", name:"Solar", description:"Add a touch of natural elegance and vibrant charm to your look with this beautifully crafted beaded bracelet! Featuring a delightful mix of smooth, colorful beads in earthy tones and soft pastels, this bracelet brings a fresh, playful vibe to any outfit. The unique combination of shapes and colors makes it a versatile accessory perfect for layering or wearing on its own as a statement piece. Lightweight and comfortable, it’s designed to brighten your day and complement your style effortlessly. Don’t miss out—grab this eye-catching bracelet now and let your wrist shine with personality and flair!", price:8, image:"products/solar.png", category:"bracelets"},
  {id:"keiper", name:"Keiper", description:"Elevate your accessory collection with this beautifully crafted wooden bead bracelet that radiates natural warmth and timeless style! Each smooth, polished bead showcases rich, deep brown hues that bring a touch of earthy sophistication to any outfit. Perfectly sized to fit comfortably on your wrist, this bracelet is lightweight yet durable—ideal for everyday wear or special occasions. Whether you're dressing up a casual look or adding a subtle statement to your ensemble, this bracelet effortlessly blends simplicity with elegance.", price:8, image:"products/keiper.png", category:"bracelets"},
  {id:"saturn", name:"Saturn", description:"Discover the perfect blend of natural charm and bold style with this stunning beaded bracelet, featuring a beautiful mix of warm wooden beads in rich browns and honey tones that bring a cozy, earthy vibe to any outfit. Its versatile design makes it ideal for layering or wearing solo as a standout piece, crafted for comfort and durability to add a touch of nature-inspired elegance to your everyday look or to gift someone special. Whether you’re dressing up or keeping it casual, this bracelet is sure to become your new favorite go-to accessory. Don’t wait—grab this eye-catching bracelet now and let your wrist do the talking with effortless style and natural beauty!", price:8, image:"products/saturn.png", category:"bracelets"}
];

let currentFilter = "all";

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const filtered = products.filter(p =>
    currentFilter === "all" ? true : p.category === currentFilter
  );

  filtered.forEach(p => {
    grid.innerHTML += `
      <div class="product-card">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>$${p.price}</p>
        <div class="product-description">${p.description}</div>
        <button class="add-btn" onclick="add('${p.id}')">Add to Cart</button>
      </div>
    `;
  });

  updateCartCount();
}

function filter(type) {
  currentFilter = type;
  render();

  // update active filter UI
  document.querySelectorAll(".sidebar a").forEach(a => a.classList.remove("active"));
  event.target.classList.add("active");
}

function add(id) {
  const p = products.find(x => x.id === id);

  if (!cart[id]) cart[id] = {product:p, qty:1};
  else cart[id].qty++;

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount() {
  let count = Object.values(cart).reduce((a,b)=>a+b.qty,0);
  document.getElementById("cartCount").innerText = count;
}

function goToCart() {
  window.location.href = "cart.html";
}

render();
</script>

</body>
</html>
