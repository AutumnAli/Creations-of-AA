<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Shop All Products | Creations of AA</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at center,
    #d4af37 0%,
    #a97458 50%,
    #c0c0c0 100%);
}

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
}

.back-home {
  text-decoration: none;
  font-weight: 700;
  color: #e57f2c;
}

/* CART */
.cart-btn {
  background: #ff9f50;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

/* LAYOUT */
.layout {
  display: flex;
}

/* SIDEBAR (FIXED THE WHITE ISSUE) */
.sidebar {
  width: 220px;
  padding: 20px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
  border-right: 1px solid rgba(255,255,255,0.2);
}

.sidebar h2 {
  color: #2b2b2b;
}

.sidebar a {
  display: block;
  padding: 8px;
  margin: 5px 0;
  border-radius: 10px;
  text-decoration: none;
  color: #2b2b2b;
  transition: 0.2s;
}

/* FILTER STYLE (ALL SAME LOOK) */
.sidebar a:hover {
  background: rgba(255,159,80,0.25);
}

.sidebar a.active {
  background: #ff9f50;
  color: white;
}

/* MAIN */
.content {
  flex: 1;
  padding: 20px;
}

/* GRID */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

/* CARD */
.product-card {
  background: rgba(255,255,255,0.92);
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  transition: 0.2s ease;
}

.product-card:hover {
  transform: translateY(-5px);
}

/* FIX ALL IMAGE SIZES (Custo M + Mice INCLUDED) */
.product-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
}

/* BUTTON */
.add-btn {
  background: #ff9f50;
  border: none;
  color: white;
  padding: 8px;
  border-radius: 15px;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
}

.add-btn:hover {
  background: #e57f2c;
}

/* CART COUNT */
.cart-count {
  background: white;
  color: #e57f2c;
  padding: 2px 8px;
  border-radius: 20px;
  margin-left: 6px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="top-bar">
  <a href="index.html" class="back-home">← Back to Home</a>

  <button class="cart-btn" onclick="goToCart()">
    🛒 Cart <span id="cartCount" class="cart-count">0</span>
  </button>
</div>

<div class="layout">

  <!-- FILTERS -->
  <aside class="sidebar">
    <h2>Shop</h2>

    <a href="#" class="active" onclick="filter('all')">All Products</a>
    <a href="#" onclick="filter('earrings')">Earrings</a>
    <a href="#" onclick="filter('necklaces')">Necklaces</a>
    <a href="#" onclick="filter('bracelets')">Bracelets</a>
  </aside>

  <!-- MAIN -->
  <main class="content">
    <h1>Shop</h1>
    <section class="product-grid" id="grid"></section>
  </main>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

const products = [
  {id:"shooting-star", name:"Shooting Star", price:15, image:"products/shooting-star.png", category:"earrings"},
  {id:"the-ants", name:"The Ants", price:10, image:"products/the-ants.png", category:"earrings"},
  {id:"aligned", name:"Aligned", price:10, image:"products/aligned.png", category:"earrings"},
  {id:"constellations", name:"Constellations", price:15, image:"products/constellations.png", category:"earrings"},

  {id:"expansions", name:"Expansions", price:18, image:"products/expansions.png", category:"necklaces"},
  {id:"newton", name:"Newton", price:10, image:"products/newton.png", category:"necklaces"},
  {id:"life", name:"Life", price:10, image:"products/life.png", category:"necklaces"},

  {id:"AA-collectable", name:"AA Collectable", price:15, image:"products/AA-collectable.png", category:"earrings"},
  {id:"custom-ms", name:"Custo M's", price:15, image:"products/Custo M's.png", category:"earrings"},

  {id:"the-mice", name:"The Mice", price:10, image:"products/the-mice.png", category:"earrings"},

  {id:"solar", name:"Solar", price:5, image:"products/solar.png", category:"bracelets"},
  {id:"keiper", name:"Keiper", price:5, image:"products/keiper.png", category:"bracelets"},
  {id:"saturn", name:"Saturn", price:5, image:"products/saturn.png", category:"bracelets"}
];

let currentFilter = "all";

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const filtered = products.filter(p =>
    currentFilter === "all" ? true : p.category === currentFilter
  );

  filtered.forEach(p => {
    grid.innerHTML += `
      <div class="product-card">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>$${p.price}</p>
        <button class="add-btn" onclick="add('${p.id}')">Add to Cart</button>
      </div>
    `;
  });

  updateCartCount();
}

function filter(type) {
  currentFilter = type;
  render();

  // update active filter UI
  document.querySelectorAll(".sidebar a").forEach(a => a.classList.remove("active"));
  event.target.classList.add("active");
}

function add(id) {
  const p = products.find(x => x.id === id);

  if (!cart[id]) cart[id] = {product:p, qty:1};
  else cart[id].qty++;

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount() {
  let count = Object.values(cart).reduce((a,b)=>a+b.qty,0);
  document.getElementById("cartCount").innerText = count;
}

function goToCart() {
  window.location.href = "cart.html";
}

render();
</script>

</body>
</html>
