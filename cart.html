<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart | Creations of AA</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at center,
    #d4af37 0%,
    #a97458 50%,
    #c0c0c0 100%);
  color: #2b2b2b;
}

/* HEADER */
header {
  text-align: center;
  padding: 20px;
  font-size: 1.6rem;
  font-weight: bold;
  color: white;
}

/* BACK BUTTON */
.back-home {
  display: inline-block;
  margin: 10px 20px;
  padding: 10px 16px;
  background: white;
  border-radius: 999px;
  text-decoration: none;
  color: #2b2b2b;
  font-weight: 600;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

/* LAYOUT */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}

/* CARDS */
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

/* PRODUCT GRID (matches homepage style) */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

/* PRODUCT CARD */
.product-card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
}

.product-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.product-body {
  padding: 10px;
}

.product-body h3 {
  margin: 0;
  font-size: 1rem;
}

.small {
  font-size: 0.85rem;
  color: #666;
}

/* BUTTON */
.btn {
  background: #ff9f50;
  border: none;
  color: white;
  padding: 10px;
  border-radius: 20px;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
}

.btn:hover {
  background: #e57f2c;
}

/* RECOMMENDATIONS */
.rec-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.rec-card {
  border: 1px solid #eee;
  padding: 10px;
  border-radius: 10px;
  background: #fff;
}

.rec-card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>🛒 Your Cart</header>
<a href="index.html" class="back-home">← Back to Home</a>

<div class="container">

  <!-- LEFT -->
  <div>

    <div class="card">
      <h2>Your Items</h2>
      <div id="cartGrid" class="product-grid"></div>
      <div class="cart-row">
  <span>Subtotal</span>
  <span id="cartSubtotal">$0.00</span>
</div>

<div class="cart-row">
  <span>Shipping</span>
  <span id="cartShipping">$0.00</span>
</div>

<div class="cart-row">
  <span>Total</span>
  <span id="cartTotal">$0.00</span>
</div>
      <p class="small" id="insight"></p>
    </div>

    <!-- CHECKOUT -->
<div class="card" style="margin-top:15px;">
  <h2>Checkout</h2>

  <form id="checkoutForm">

    <input
      type="hidden"
      name="orderDetails"
      id="orderDetailsField"
    >

    <input
      id="name"
      placeholder="Full Name"
      required
      style="width:100%;padding:8px;margin:5px 0;"
    >

    <input
      id="email"
      placeholder="Email"
      type="email"
      required
      style="width:100%;padding:8px;margin:5px 0;"
    >

    <textarea
      id="address"
      placeholder="Address"
      required
      style="width:100%;padding:8px;margin:5px 0;"
    ></textarea>

    <div style="
      background:#fff8f0;
      padding:12px;
      border-radius:10px;
      margin:10px 0;
      font-size:0.9rem;
      line-height:1.5;
    ">
      🔒 Secure checkout via Cash App<br>
      📦 $5.99 shipping • Free over $60<br>
      ✨ Handmade in small batches
    </div>

    <button class="btn" type="submit">
      Pay Exact Total
    </button>

    <p style="
      font-size:0.8rem;
      color:#666;
      margin-top:8px;
    ">
      Orders are manually verified before shipment.
    </p>

    <button
      type="button"
      id="confirmPaymentBtn"
      class="btn"
      style="background:#fff;color:#2b2b2b;border:1px solid #ddd;"
    >
      Submit Order After Payment
    </button>

    <p id="msg" class="small"></p>

  </form>
</div>

  </div>

  <!-- RIGHT -->
  <div>

    <div class="card">
      <h2>Recommended for You</h2>
      <div id="recs" class="rec-grid"></div>
    </div>

  </div>

</div>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("OyXgVg6KtEcRAkunx");
</script>

<script>
/* PRODUCTS */
const products = [
  {id:"shooting-star",name:"Shooting Star",price:18,tag:"Bright",image:"products/shooting-star.png"},
  {id:"the-ants",name:"The Ants",price:10,tag:"Popular",image:"products/the-ants.png"},
  {id:"constellations",name:"Constellations",price:18,tag:"Cosmic",image:"products/constellations.png"},
  {id:"expansions",name:"Expansions",price:20,tag:"Earthy",image:"products/expansions.png"},
  {id:"cerulean",name:"Cerulean",price:18,tag:"Bright",image:"products/cerulean.png"},
  {id:"saturn",name:"Saturn",price:8,tag:"Cosmic",image:"products/saturn.png"}
];

let cart = JSON.parse(localStorage.getItem("cart")) || {};

/* RENDER CART */
function renderCart() {
  const el = document.getElementById("cartGrid");
  el.innerHTML = "";

  let subtotal = 0;

  Object.values(cart).forEach(item => {
    subtotal += item.product.price * item.qty;

    const card = document.createElement("div");
    card.className = "product-card";

    card.innerHTML = `
      <img src="${item.product.image}">
      <div class="product-body">
        <h3>${item.product.name}</h3>

        <p class="small">
          Qty: ${item.qty}
        </p>

        <p>
          $${(item.product.price * item.qty).toFixed(2)}
        </p>

        <button
          class="btn"
          onclick="changeQty('${item.product.id}', 1)"
        >
          +
        </button>

        <button
          class="btn"
          onclick="changeQty('${item.product.id}', -1)"
        >
          -
        </button>
      </div>
    `;

    el.appendChild(card);
  });

  let shipping = 0;

  if (subtotal > 0 && subtotal < 60) {
    shipping = 5.99;
  }

  const total = subtotal + shipping;

  document.getElementById("cartSubtotal").innerText =
    "$" + subtotal.toFixed(2);

  document.getElementById("cartShipping").innerText =
    "$" + shipping.toFixed(2);

  document.getElementById("cartTotal").innerText =
    "$" + total.toFixed(2);

  updateInsight();
}

/* QTY */
function changeQty(id, delta) {
  if (!cart[id]) return;

  cart[id].qty += delta;

  if (cart[id].qty <= 0) delete cart[id];

  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
  renderRecs();
}

/* INSIGHT */
function updateInsight() {
  if (Object.keys(cart).length === 0) {
    document.getElementById("insight").innerText =
      "Add items to unlock AI insights.";
    return;
  }

  let tags = {};
  Object.values(cart).forEach(i => {
    tags[i.product.tag] = (tags[i.product.tag] || 0) + i.qty;
  });

  let top = Object.entries(tags).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById("insight").innerText =
    "AI Insight: You prefer " + top[0] + " styles.";
}

/* RECS */
function renderRecs() {
  const el = document.getElementById("recs");
  el.innerHTML = "";

  const owned = new Set(Object.keys(cart));

  products
    .filter(p => !owned.has(p.id))
    .slice(0,4)
    .forEach(p => {
      el.innerHTML += `
        <div class="rec-card">
          <img src="${p.image}">
          <b>${p.name}</b>
          <div class="small">${p.tag}</div>
          <button class="btn" onclick="add('${p.id}')">Add</button>
        </div>
      `;
    });
}

/* ADD */
function add(id) {
  const p = products.find(x => x.id === id);

  if (!cart[id]) cart[id] = {product:p, qty:1};
  else cart[id].qty++;

  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
  renderRecs();
}

/* CHECKOUT */
document
  .getElementById("checkoutForm")
  .addEventListener("submit", async (e) => {

    e.preventDefault();

    if (Object.keys(cart).length === 0) {
      document.getElementById("msg").innerText =
        "Your cart is empty.";
      return;
    }

    const name =
      document.getElementById("name").value;

    const email =
      document.getElementById("email").value;

    const address =
      document.getElementById("address").value;

    let subtotal = 0;

    Object.values(cart).forEach(item => {
      subtotal += item.product.price * item.qty;
    });

    let shipping = 0;

    if (subtotal > 0 && subtotal < 60) {
      shipping = 5.99;
    }

    const total = subtotal + shipping;

    const orderDetails =
      Object.values(cart).map(item => ({
        name: item.product.name,
        price: item.product.price,
        quantity: item.qty
      }));

    const pendingOrder = {
      id: "AA-" + Date.now(),
      name,
      email,
      address,
      items: orderDetails,
      subtotal,
      shipping,
      total,
      date: new Date().toISOString(),
      status: "awaiting payment"
    };

    localStorage.setItem(
      "pendingOrder",
      JSON.stringify(pendingOrder)
    );

    document.getElementById("msg").innerText =
      `Redirecting to Cash App for $${total.toFixed(2)}...`;

    setTimeout(() => {
      window.location.href =
        "https://cash.app/$CreationsofAA";
    }, 1200);

});

document
  .getElementById("confirmPaymentBtn")
  .addEventListener("click", async () => {

    const pendingOrder =
      JSON.parse(
        localStorage.getItem("pendingOrder")
      );

    if (!pendingOrder) {

      document.getElementById("msg").innerText =
        "No pending order found.";

      return;
    }

    const formattedOrder =
      pendingOrder.items
        .map(item =>
          `${item.name} x${item.quantity} - $${(
            item.price * item.quantity
          ).toFixed(2)}`
        )
        .join("\n");

    try {

      document.getElementById("msg").innerText =
        "Sending order confirmation...";

      await emailjs.send(
        "service_z6oulqc",
        "template_249959r",
        {
          customer_name:
            pendingOrder.name,

          customer_email:
            pendingOrder.email,

          customer_address:
            pendingOrder.address,

          order_details:

`${formattedOrder}

Subtotal: $${pendingOrder.subtotal.toFixed(2)}
Shipping: $${pendingOrder.shipping.toFixed(2)}
Total Paid: $${pendingOrder.total.toFixed(2)}`
        }
      );

      localStorage.removeItem("pendingOrder");

      localStorage.removeItem("cart");

      cart = {};

      renderCart();

      renderRecs();

      document
        .getElementById("checkoutForm")
        .reset();

      document.getElementById("msg").innerText =
        "Order received! Payment will be manually verified.";

    } catch (error) {

      console.error(error);

      document.getElementById("msg").innerText =
        "Failed to send order.";
    }

  });
/* INIT */
renderCart();
renderRecs();

</script>

</body>
</html>
