<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart | Creations of AA</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at center,
    #d4af37 0%,
    #a97458 50%,
    #c0c0c0 100%);
  color: #2b2b2b;
}

/* HEADER */
header {
  text-align: center;
  padding: 20px;
  font-size: 1.6rem;
  font-weight: bold;
  color: white;
}

/* BACK BUTTON */
.back-home {
  display: inline-block;
  margin: 10px 20px;
  padding: 10px 16px;
  background: white;
  border-radius: 999px;
  text-decoration: none;
  color: #2b2b2b;
  font-weight: 600;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

/* LAYOUT */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}

/* CARDS */
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

/* PRODUCT GRID (matches homepage style) */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

/* PRODUCT CARD */
.product-card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
}

.product-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.product-body {
  padding: 10px;
}

.product-body h3 {
  margin: 0;
  font-size: 1rem;
}

.small {
  font-size: 0.85rem;
  color: #666;
}

/* BUTTON */
.btn {
  background: #ff9f50;
  border: none;
  color: white;
  padding: 10px;
  border-radius: 20px;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
}

.btn:hover {
  background: #e57f2c;
}

/* RECOMMENDATIONS */
.rec-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.rec-card {
  border: 1px solid #eee;
  padding: 10px;
  border-radius: 10px;
  background: #fff;
}

.rec-card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>🛒 Your Cart</header>
<a href="index.html" class="back-home">← Back to Home</a>

<div class="container">

  <!-- LEFT -->
  <div>

    <div class="card">
      <h2>Your Items</h2>
      <div id="cartGrid" class="product-grid"></div>
      <h3>Total: <span id="total">$0.00</span></h3>
      <p class="small" id="insight"></p>
    </div>

    <!-- CHECKOUT -->
    <div class="card" style="margin-top:15px;">
      <h2>Checkout</h2>

      <form id="checkoutForm"
        action="https://formspree.io/f/xpqbqqyz"
        method="POST">

        <input type="hidden" name="orderDetails" id="orderDetailsField">

        <input id="name" placeholder="Full Name" required style="width:100%;padding:8px;margin:5px 0;">
        <input id="email" placeholder="Email" type="email" required style="width:100%;padding:8px;margin:5px 0;">
        <textarea id="address" placeholder="Address" required style="width:100%;padding:8px;margin:5px 0;"></textarea>

        <button class="btn" type="submit">Place Order</button>
        <p id="msg" class="small"></p>
      </form>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="card">
    <h2>Recommended</h2>
    <div class="rec-grid" id="recs"></div>
  </div>

</div>

<script>

/* PRODUCTS */
const products = [
  {id:"shooting-star",name:"Shooting Star",price:15,tag:"Bright",image:"products/shooting-star.png"},
  {id:"the-ants",name:"The Ants",price:10,tag:"Popular",image:"products/the-ants.png"},
  {id:"constellations",name:"Constellations",price:15,tag:"Cosmic",image:"products/constellations.png"},
  {id:"expansions",name:"Expansions",price:18,tag:"Earthy",image:"products/expansions.png"},
  {id:"cerulean",name:"Cerulean",price:15,tag:"Bright",image:"products/cerulean.png"},
  {id:"saturn",name:"Saturn",price:5,tag:"Cosmic",image:"products/saturn.png"},
  {id:"life",name:"Life",price:10,tag:"Symbolic",image:"products/life.png"},
  {id:"aligned",name:"Aligned",price:15,tag:"Bright",image:"products/aligned.png"},
  {id:"Custo M's",name:"Custo M's",price:15,tag:"Customizable",image:"products/Custo M's.png"},
  {id:"AA-collectable",name:"AA Collectable",price:15,tag:"Limited-Time (Custom)",image:"products/AA-collectable.png"},
  {id:"the-mice",name:"The Mice",price:5,tag:"Unique",image:"products/the-mice.png"},
  {id:"newton",name:"Newton",price:10,tag:"Symbolic",image:"products/newton.png"},
  {id:"solar",name:"Solar",price:5,tag:"Cosmic",image:"products/solar.png"}
];

let cart = JSON.parse(localStorage.getItem("cart")) || {};
/* RENDER CART */
function renderCart() {
  const el = document.getElementById("cartGrid");
  el.innerHTML = "";

  let total = 0;

  Object.values(cart).forEach(item => {
    total += item.product.price * item.qty;

    const card = document.createElement("div");
    card.className = "product-card";

    card.innerHTML = `
      <img src="${item.product.image}">
      <div class="product-body">
        <h3>${item.product.name}</h3>
        <p class="small">Qty: ${item.qty}</p>
        <p>$${(item.product.price * item.qty).toFixed(2)}</p>

        <button class="btn" onclick="changeQty('${item.product.id}', 1)">+</button>
        <button class="btn" onclick="changeQty('${item.product.id}', -1)">-</button>
      </div>
    `;

    el.appendChild(card);
  });

  document.getElementById("total").innerText = "$" + total.toFixed(2);
  updateInsight();
}

/* QTY */
function changeQty(id, delta) {
  if (!cart[id]) return;

  cart[id].qty += delta;

  if (cart[id].qty <= 0) delete cart[id];

  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
  renderRecs();
}

/* INSIGHT */
function updateInsight() {
  if (Object.keys(cart).length === 0) {
    document.getElementById("insight").innerText =
      "Add items to unlock AI insights.";
    return;
  }

  let tags = {};
  Object.values(cart).forEach(i => {
    tags[i.product.tag] = (tags[i.product.tag] || 0) + i.qty;
  });

  let top = Object.entries(tags).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById("insight").innerText =
    "AI Insight: You prefer " + top[0] + " styles.";
}

/* RECS */
function renderRecs() {
  const el = document.getElementById("recs");
  el.innerHTML = "";

  const owned = new Set(Object.keys(cart));

  products
    .filter(p => !owned.has(p.id))
    .slice(0,4)
    .forEach(p => {
      el.innerHTML += `
        <div class="rec-card">
          <img src="${p.image}">
          <b>${p.name}</b>
          <div class="small">${p.tag}</div>
          <button class="btn" onclick="add('${p.id}')">Add</button>
        </div>
      `;
    });
}

/* ADD */
function add(id) {
  const p = products.find(x => x.id === id);

  if (!cart[id]) cart[id] = {product:p, qty:1};
  else cart[id].qty++;

  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
  renderRecs();
}

/* CHECKOUT */
document.getElementById("checkoutForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.getElementById("name").value;

  const order = Object.values(cart)
    .map(i => `${i.product.name} x${i.qty}`)
    .join(", ");

  document.getElementById("orderDetailsField").value =
`Name: ${name}
Order: ${order}`;

  document.getElementById("msg").innerText =
    "Thanks " + name + "! Order sent.";

  this.submit();
});

/* INIT */
renderCart();
renderRecs();

</script>

</body>
</html>
