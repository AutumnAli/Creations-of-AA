<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart | Creations of AA</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at center,
    #d4af37 0%,
    #a97458 50%,
    #c0c0c0 100%);
  color: #2b2b2b;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 1.6rem;
  font-weight: bold;
  color: white;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 20px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.item {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
  border-bottom: 1px solid #eee;
  padding-bottom: 8px;
}

.small {
  font-size: 0.85rem;
  color: #666;
}

.btn {
  background: #ff9f50;
  border: none;
  color: white;
  padding: 10px;
  border-radius: 20px;
  cursor: pointer;
  width: 100%;
}

.btn:hover {
  background: #e57f2c;
}

.rec-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}

.rec-card {
  border: 1px solid #eee;
  padding: 10px;
  border-radius: 10px;
  background: #fff;
}

.rec-card img {
  height: 120px;
  object-fit: cover;
}
</style>
</head>

<body>

<header>🛒 Your Cart</header>

<a href="index.html" class="back-home">← Back to Home</a>

<div class="container">

  <!-- LEFT: CART + CHECKOUT -->
  <div>

    <div class="card">
      <h2>Cart Items</h2>
      <div id="cart"></div>
      <h3>Total: <span id="total">$0.00</span></h3>
      <p class="small" id="insight"></p>
    </div>

    <!-- CHECKOUT -->
    <div class="card" style="margin-top:15px;">
      <h2>Checkout</h2>

      <form id="checkoutForm"
        action="https://formspree.io/f/xpqbqqyz"
        method="POST">

        <input type="hidden" name="orderDetails" id="orderDetailsField">

        <input id="name" placeholder="Full Name" required
          style="width:100%;padding:8px;margin:5px 0;">

        <input id="email" placeholder="Email" type="email" required
          style="width:100%;padding:8px;margin:5px 0;">

        <textarea id="address" placeholder="Address" required
          style="width:100%;padding:8px;margin:5px 0;"></textarea>

        <button class="btn" type="submit">Place Order</button>

        <p id="msg" class="small"></p>
      </form>
    </div>

  </div>

  <!-- RIGHT: AI RECOMMENDATIONS -->
  <div class="card">
    <h2>Recommended for you</h2>
    <div class="rec-grid" id="recs"></div>
  </div>

</div>

<script>

/* =========================
   PRODUCTS (must match homepage IDs)
========================= */
const products = [
  {id:"shooting-star",name:"Shooting Star",price:15,tag:"Bright",image:"products/shooting-star.png"},
  {id:"the-ants",name:"The Ants",price:10,tag:"Popular",image:"products/the-ants.png"},
  {id:"constellations",name:"Constellations",price:15,tag:"Cosmic",image:"products/constellations.png"},
  {id:"expansions",name:"Expansions",price:18,tag:"Earthy",image:"products/expansions.png"},
  {id:"cerulean",name:"Cerulean",price:10,tag:"Bright",image:"products/cerulean.png"},
  {id:"saturn",name:"Saturn",price:5,tag:"Cosmic",image:"products/saturn.png"}
];

/* =========================
   CART LOAD
========================= */
let cart = JSON.parse(localStorage.getItem("cart")) || {};

/* =========================
   RENDER CART
========================= */
function renderCart() {
  const el = document.getElementById("cart");
  el.innerHTML = "";

  let total = 0;

  Object.values(cart).forEach(i => {
    total += i.product.price * i.qty;

    el.innerHTML += `
  <div class="item">
    <div style="display:flex; gap:10px; align-items:center;">
      
      <img src="${i.product.image}" 
           style="width:50px;height:50px;object-fit:cover;border-radius:8px;">

      <div>
        <b>${i.product.name}</b>
        <div class="small">x${i.qty}</div>
      </div>

    </div>

    <div>$${(i.product.price * i.qty).toFixed(2)}</div>
  </div>
`;
    });

  document.getElementById("total").innerText = "$" + total.toFixed(2);

  updateInsight();
}

/* =========================
   SIMPLE AI INSIGHT
========================= */
function updateInsight() {
  if (Object.keys(cart).length === 0) {
    document.getElementById("insight").innerText =
      "Add items to unlock AI recommendations.";
    return;
  }

  let tags = {};
  Object.values(cart).forEach(i => {
    tags[i.product.tag] = (tags[i.product.tag] || 0) + i.qty;
  });

  let top = Object.entries(tags).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById("insight").innerText =
    "AI Insight: You prefer " + top[0] + " styles.";
}

/* =========================
   RECOMMENDATIONS ENGINE
========================= */
function getRecs() {
  const owned = new Set(Object.keys(cart));

  return products
    .filter(p => !owned.has(p.id))
    .sort((a,b) => (b.price + Math.random()*10) - (a.price + Math.random()*10))
    .slice(0,4);
}

/* =========================
   RENDER RECS
========================= */
function renderRecs() {
  const el = document.getElementById("recs");
  el.innerHTML = "";

  getRecs().forEach(p => {
    el.innerHTML += `
      <div class="rec-card">
        <b>${p.name}</b>
        <div class="small">${p.tag}</div>
        <div>$${p.price}</div>
        <button class="btn" onclick="add('${p.id}')">Add</button>
      </div>
    `;
  });
}

/* =========================
   ADD TO CART
========================= */
function add(id) {
  const p = products.find(x => x.id === id);

  if (!cart[id]) cart[id] = {product:p, qty:1};
  else cart[id].qty++;

  localStorage.setItem("cart", JSON.stringify(cart));

  renderCart();
  renderRecs();
}

/* =========================
   CHECKOUT
========================= */
document.getElementById("checkoutForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const address = document.getElementById("address").value;

  const order = Object.values(cart)
    .map(i => `${i.product.name} x${i.qty}`)
    .join(", ");

  document.getElementById("orderDetailsField").value =
`Name: ${name}
Email: ${email}
Address: ${address}
Order: ${order}`;

  document.getElementById("msg").innerText =
    "Thanks " + name + "! Order sent.";

  cart = {};
  localStorage.setItem("cart", JSON.stringify(cart));

  renderCart();
  renderRecs();

  this.submit();
});

/* INIT */
renderCart();
renderRecs();

</script>

</body>
</html>
