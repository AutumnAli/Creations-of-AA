<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Earrings</title>
  <a href="products.html" class="back-button">← Back to Shop</a>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>Shop</h2>
      <ul>
        <li><a href="products.html">All Products</a></li>
        <li><a href="earrings.html" class="active">Earrings</a></li>
        <li><a href="necklaces.html">Necklaces</a></li>
        <li><a href="bracelets.html">Bracelets</a></li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">
      <h1 class="page-title">Earrings</h1>

      <section class="product-grid">

        <div class="product-card reveal">
          <a href="products/shooting-star.html">
            <img src="products/shooting-star.png" alt="Shooting Star">
            <h3>Shooting Star</h3>
            <p class="price">$18.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/the-ants.html">
            <img src="products/the-ants.png" alt="The Ants">
            <h3>The Ants</h3>
            <p class="price">$10.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/aligned.html">
            <img src="products/aligned.png" alt="Aligned">
            <h3>Aligned</h3>
            <p class="price">$10.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/constellations.html">
            <img src="products/constellations.png" alt="Constellations">
            <h3>Constellations</h3>
            <p class="price">$18.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/cerulean.html">
            <img src="products/cerulean.png" alt="Cerulean">
            <h3>Cerulean</h3>
            <p class="price">$18.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/AA-collectable.html">
            <img src="products/AA-collectable.png" alt="AA Collectable">
            <h3>AA Collectable</h3>
            <p class="price">$18.00</p>
          </a>
        </div>

      </section>
    </main>
  </div>

  <!-- Custo M's -->
<div class="product-card reveal">
  <a href="products/Custo M's.html">
    <img src="products/Custo M's.png" alt="Custo M's Earrings">
    <h3>Custo M's Earrings</h3>
    <p class="price">$18.00</p>
  </a>
</div>

<!-- The Mice -->
<div class="product-card reveal">
  <a href="products/the-mice.html">
    <img src="products/the-mice.png" alt="The Mice Earrings">
    <h3>The Mice Earrings</h3>
    <p class="price">$8.00</p>
  </a>
</div>

  <!-- SCROLL REVEAL SCRIPT -->
  <script>
    const reveals = document.querySelectorAll('.reveal');
    function revealOnScroll() {
      const windowHeight = window.innerHeight;
      reveals.forEach(el => {
        const top = el.getBoundingClientRect().top;
        if (top < windowHeight - 100) el.classList.add('visible');
      });
    }
    window.addEventListener('scroll', revealOnScroll);
    revealOnScroll();
  </script>

  <!-- Lightbox modal -->
  <div id="lightbox" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;z-index:9999;background:rgba(0,0,0,0.75)"> 
    <div style="position:relative;max-width:90%;max-height:90%;"> 
      <button id="lightbox-close" style="position:absolute;top:-18px;right:-18px;background:#fff;border-radius:50%;border:none;width:36px;height:36px;cursor:pointer;font-weight:700">×</button>
      <img id="lightbox-img" src="" alt="" style="display:block;max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.5)">
      <div id="lightbox-caption" style="color:#fff;text-align:center;margin-top:8px"></div>
    </div>
  </div>

  <script>
    // open lightbox when product images are clicked (prevent following link)
    document.addEventListener('click', function (e) {
      const img = e.target.closest('.product-card img');
      if (!img) return;
      e.preventDefault();
      const lb = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox-caption').textContent = img.alt || '';
      lb.style.display = 'flex';
    });

    document.getElementById('lightbox-close').addEventListener('click', function () {
      document.getElementById('lightbox').style.display = 'none';
      document.getElementById('lightbox-img').src = '';
    });
  </script>

</body>
</html>
