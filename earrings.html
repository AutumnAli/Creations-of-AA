<body>
  <div class="layout">

    <!-- SIDEBAR -->

      <h2>Shop</h2>
      <ul>
        <li><a href="products.html">All Products</a></li>
        <li><a href="earrings.html" class="active">Earrings</a></li>
        <li><a href="necklaces.html">Necklaces</a></li>
        <li><a href="bracelets.html">Bracelets</a></li>

    <!-- MAIN CONTENT -->
    <main class="content">

        <div class="product-card reveal">
          <a href="products/the-ants.html">

            <p class="price">$10.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/aligned.html">
            <img src="products/aligned.png" alt="Aligned">
            <h3>Aligned</h3>
            <p class="price">$10.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/constellations.html">

        <div class="product-card reveal">

  <!-- Custo M's -->
<div class="product-card reveal">

    <img src="products/Custo M's.png" alt="Custo M's Earrings">
    <h3>Custo M's Earrings</h3>
    <p class="price">$15.00</p>
  </a>
</div>

<!-- The Mice -->
<div class="product-card reveal">
  <a href="products/the-mice.html">
    <img src="products/the-mice.png" alt="The Mice Earrings">
    <h3>The Mice Earrings</h3>
    <p class="price">$5.00</p>
  </a>
</div>

  <!-- SCROLL REVEAL SCRIPT -->
  <script>
    const reveals = document.querySelectorAll('.reveal');
    function revealOnScroll() {
      const windowHeight = window.innerHeight;
      reveals.forEach(el => {
        const top = el.getBoundingClientRect().top;
        if (top < windowHeight - 100) el.classList.add('visible');
      });
    }
    window.addEventListener('scroll', revealOnScroll);
    revealOnScroll();
  </script>

</body>
</html>
