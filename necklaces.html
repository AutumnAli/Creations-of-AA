<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Necklaces</title>
  <a href="products.html" class="back-button">← Back to Shop</a>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="layout">

    <aside class="sidebar">
      <h2>Shop</h2>
      <ul>
        <li><a href="products.html">All Products</a></li>
        <li><a href="earrings.html">Earrings</a></li>
        <li><a href="necklaces.html" class="active">Necklaces</a></li>
        <li><a href="bracelets.html">Bracelets</a></li>
      </ul>
    </aside>

    <main class="content">
      <h1 class="page-title">Necklaces</h1>

      <section class="product-grid">

        <div class="product-card reveal">
          <a href="products/expansions.html">
            <img src="products/expansions.png" alt="Expansions">
            <h3>Expansions</h3>
            <p class="price">$20.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/newton.html">
            <img src="products/newton.png" alt="Newton">
            <h3>Newton</h3>
            <p class="price">$18.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/life.html">
            <img src="products/life.png" alt="Life">
            <h3>Life</h3>
            <p class="price">$10.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/emerald-glow.html">
            <img src="products/emerald-glow.png" alt="Emerald Glow">
            <h3>Emerald Glow</h3>
            <p class="price">$12.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/midnight-oasis.html">
            <img src="products/midnight-oasis.png" alt="Midnight Oasis">
            <h3>Midnight Oasis</h3>
            <p class="price">$12.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/mystic-drop.html">
            <img src="products/mystic-drop.png" alt="Mystic Drop">
            <h3>Mystic Drop</h3>
            <p class="price">$12.00</p>
          </a>
        </div>

      </section>
    </main>
  </div>

  <script>
    const reveals = document.querySelectorAll('.reveal');
    function revealOnScroll() {
      const windowHeight = window.innerHeight;
      reveals.forEach(el => {
        const top = el.getBoundingClientRect().top;
        if (top < windowHeight - 100) el.classList.add('visible');
      });
    }
    window.addEventListener('scroll', revealOnScroll);
    revealOnScroll();
  </script>

</body>
</html>
