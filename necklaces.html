<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Necklaces</title>
  <a href="products.html" class="back-button">← Back to Shop</a>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="layout">

    <aside class="sidebar">
      <h2>Shop</h2>
      <ul>
        <li><a href="products.html">All Products</a></li>
        <li><a href="earrings.html">Earrings</a></li>
        <li><a href="necklaces.html" class="active">Necklaces</a></li>
        <li><a href="bracelets.html">Bracelets</a></li>
      </ul>
    </aside>

    <main class="content">
      <h1 class="page-title">Necklaces</h1>

      <section class="product-grid">

        <div class="product-card reveal">
          <a href="products/expansions.html">
            <img src="products/expansions.png" alt="Expansions">
            <h3>Expansions</h3>
            <p class="price">$20.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/newton.html">
            <img src="products/newton.png" alt="Newton">
            <h3>Newton</h3>
            <p class="price">$18.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/life.html">
            <img src="products/life.png" alt="Life">
            <h3>Life</h3>
            <p class="price">$10.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/emerald-glow.html">
            <img src="products/emerald-glow.png" alt="Emerald Glow">
            <h3>Emerald Glow</h3>
            <p class="price">$12.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/midnight-oasis.html">
            <img src="products/midnight-oasis.png" alt="Midnight Oasis">
            <h3>Midnight Oasis</h3>
            <p class="price">$12.00</p>
          </a>
        </div>

        <div class="product-card reveal">
          <a href="products/mystic-drop.html">
            <img src="products/mystic-drop.png" alt="Mystic Drop">
            <h3>Mystic Drop</h3>
            <p class="price">$12.00</p>
          </a>
        </div>

      </section>
    </main>
  </div>

  <script>
    const reveals = document.querySelectorAll('.reveal');
    function revealOnScroll() {
      const windowHeight = window.innerHeight;
      reveals.forEach(el => {
        const top = el.getBoundingClientRect().top;
        if (top < windowHeight - 100) el.classList.add('visible');
      });
    }
    window.addEventListener('scroll', revealOnScroll);
    revealOnScroll();
  </script>

  <!-- Lightbox modal -->
  <div id="lightbox" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;z-index:9999;background:rgba(0,0,0,0.75)"> 
    <div style="position:relative;max-width:90%;max-height:90%;"> 
      <button id="lightbox-close" style="position:absolute;top:-18px;right:-18px;background:#fff;border-radius:50%;border:none;width:36px;height:36px;cursor:pointer;font-weight:700">×</button>
      <img id="lightbox-img" src="" alt="" style="display:block;max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.5)">
      <div id="lightbox-caption" style="color:#fff;text-align:center;margin-top:8px"></div>
    </div>
  </div>

  <script>
    document.addEventListener('click', function (e) {
      const img = e.target.closest('.product-card img');
      if (!img) return;
      e.preventDefault();
      const lb = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox-caption').textContent = img.alt || '';
      lb.style.display = 'flex';
    });

    document.getElementById('lightbox-close').addEventListener('click', function () {
      document.getElementById('lightbox').style.display = 'none';
      document.getElementById('lightbox-img').src = '';
    });
  </script>

</body>
</html>
